name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_eval"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # CI never uses real APIs: everything runs with the deterministic mock providers.
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      DATABASE_URL: postgresql://agent:agent@localhost:5432/agent_eval
      # Integration tests fail (instead of skipping) if the database is unreachable.
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest (mock mode, including pgvector integration tests)
        run: uv run pytest
      - name: Ingest smoke test (mock embeddings into pgvector)
        run: uv run python -m agent_eval.ingest --chunk-size 500 --overlap 50
      - name: Eval smoke test (mock mode, full golden dataset)
        run: |
          for agent in react plan_execute langgraph; do
            uv run python -m evals.run_eval --mock --agent "$agent"
          done
      - name: Compare smoke test (mock runs)
        run: uv run python -m evals.compare --mock

  docker:
    # Builds the API image and checks that it answers offline (mock LLM, in-memory index).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t agent-eval-demo .
      - name: Run and query
        run: |
          docker run -d --name api -p 8000:8000 \
            -e LLM_PROVIDER=mock -e EMBEDDING_PROVIDER=mock -e VECTOR_STORE=memory \
            agent-eval-demo
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 2
          done
          curl -fsS -X POST http://localhost:8000/ask \
            -H 'Content-Type: application/json' \
            -d '{"question": "Quand une PME doit-elle émettre des factures électroniques ?"}' \
            | tee answer.json
          python3 -c "import json; b = json.load(open('answer.json')); assert b['answer'] and b['sources'], b"
      - name: Logs on failure
        if: failure()
        run: docker logs api || true
