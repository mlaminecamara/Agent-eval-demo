services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agent-eval-db
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent  # local development only
      POSTGRES_DB: agent_eval
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_eval"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
