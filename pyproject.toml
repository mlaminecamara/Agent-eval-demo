[project]
name = "agent-eval-demo"
version = "0.1.0"
description = "RAG + agentic workflows on the French e-invoicing reform, with a reproducible evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "anthropic>=0.40",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "tiktoken>=0.7",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "langgraph>=1.2",
]

[project.optional-dependencies]
# Local cross-encoder reranker (pulls in torch; not needed for mock mode or CI).
rerank = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: needs a running PostgreSQL + pgvector (DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # French text contains ambiguous-looking unicode

[tool.ruff.lint.isort]
known-first-party = ["agent_eval", "evals", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src", "evals"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
