# USD per 1M tokens. Values are left null on purpose: fill them from the providers'
# official pricing pages, set source + retrieved, and flip verified to true.
# A real run refuses to start while a model it uses has a null price
# (override with --allow-unknown-price, in which case cost is reported as "unknown").

models:
  gpt-5.4-mini-2026-03-17:
    input_per_mtok: 0.75
    output_per_mtok: 4.50
    source: OpenAI model page for GPT-5.4 Mini (screenshot checked by the repo owner)
    retrieved: 2026-11-01
    verified: true
  # Anthropic values copied from the Claude API reference bundled with Claude Code
